id: tutorial/hello
title: '<!i>Welcome'
renderer: canvas
layout:
  type: column
  width: 540
  padding: 0
  gap: 9
  theme: compact
  exit-button: true
  exit-width: 126
components:
  - id: welcome_panel
    type: column
    skin: panel
    padding: 18
    gap: 9
    children:
      - id: heading
        type: text
        text: '<!i><white>My first menu'
        height: 18
      - id: greeting
        type: text
        text: '<!i><gray>Hello, {player.name}'
        height: 27
        skin: readout
        padding: 9
      - id: hello_button
        type: button
        text: '<!i>Say hello'
        height: 27
        skin: button
        actions:
          - type: message
            text: '<!i>Hello from FutureUI!'
